    <h1>Tip Calculator</h1>

        <label for="bill">Enter bill Amount:</label>
        <input type="number" name="billAmount" id="bill">
        <label for="tip">Enter Tip Amount:</label>
        <input type="number" name="tipAmount" id="tip">
        <label>Number of People:</label>
<input type="number" id="people" placeholder="Enter number of people">

         <label for="total">Total</label>
         <span id="total">0</span>
         
    </form>
